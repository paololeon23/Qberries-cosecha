[build]
  publish = "."
  functions = "netlify/functions"
  # Sitio estático; Functions: LOGIN_PIN, API_TOKEN, APPS_SCRIPT_URL, TRABAJADORES_SCRIPT_URL

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
